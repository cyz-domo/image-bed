<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>image-bed</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bg" class="bg" aria-hidden="true"></div>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">image-bed</a>
        <nav class="nav">
          <button class="nav-link active" data-tab="home">上传</button>
          <button class="nav-link" data-tab="gallery">图片库</button>
        </nav>
        <div id="account" class="account"></div>
        <button id="settings-gear" class="gear hidden" title="站点设置" aria-label="站点设置">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8.4 2.6a1 1 0 0 1 1-.8h1.2a1 1 0 0 1 1 .8l.2 1.1c.5.2 1 .5 1.4.8l1-.4a1 1 0 0 1 1.2.4l.6 1a1 1 0 0 1-.2 1.3l-.8.7a5.6 5.6 0 0 1 0 1.6l.8.7a1 1 0 0 1 .2 1.3l-.6 1a1 1 0 0 1-1.2.4l-1-.4c-.4.3-.9.6-1.4.8l-.2 1.1a1 1 0 0 1-1 .8H9.4a1 1 0 0 1-1-.8l-.2-1.1a5.6 5.6 0 0 1-1.4-.8l-1 .4a1 1 0 0 1-1.2-.4l-.6-1a1 1 0 0 1 .2-1.3l.8-.7a5.6 5.6 0 0 1 0-1.6l-.8-.7a1 1 0 0 1-.2-1.3l.6-1a1 1 0 0 1 1.2-.4l1 .4c.4-.3.9-.6 1.4-.8l.2-1.1Z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.2" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="container">
      <section id="page-home" class="page">
        <div class="home-grid">
          <div class="home-copy">
            <h1>图片，传上去，拿走链接。</h1>
            <p class="lead">个人图床。上传后自动生成 jsDelivr CDN 链接，可直接粘贴到 Markdown 或网页里。</p>
          </div>
          <div class="home-action">
            <div id="upload-cta" class="card muted-card">
              <h2>登录后上传</h2>
              <p>本站为私人图床，使用 GitHub 授权登录后即可上传图片。</p>
              <a class="primary-button" href="/api/auth/login">使用 GitHub 登录</a>
            </div>
            <div id="upload-panel" class="card hidden">
              <label id="dropzone" class="dropzone" for="file-input">
                <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple />
                <svg class="dropzone-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 13V3m0 0L6 7m4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13v2.5A1.5 1.5 0 0 0 4.5 17h11a1.5 1.5 0 0 0 1.5-1.5V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span class="dropzone-title">点击选择或拖入图片（可多选）</span>
                <span id="dropzone-hint" class="dropzone-hint">PNG、JPG、GIF、WebP</span>
              </label>
              <div id="upload-progress" class="progress hidden"><div id="upload-progress-bar" class="progress-bar"></div></div>
              <div id="upload-status" class="status" role="status"></div>
              <div id="upload-results" class="results"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="page-gallery" class="page hidden">
        <div class="gallery-head">
          <h2 class="gallery-title">图片库</h2>
          <span id="gallery-count" class="gallery-count"></span>
          <span class="gallery-tools">
            <button id="select-mode" class="ghost-button small hidden">批量管理</button>
            <button id="select-all" class="ghost-button small hidden">全选</button>
            <button id="delete-selected" class="ghost-button small danger hidden">删除选中</button>
            <button id="select-exit" class="ghost-button small hidden">退出管理</button>
          </span>
        </div>
        <div id="gallery" class="masonry"><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:160px"></div><div class="skeleton" style="height:200px"></div></div>
        <p id="gallery-login" class="card muted-card empty hidden">图片库仅对登录用户开放。<a class="primary-button" href="/api/auth/login">使用 GitHub 登录</a></p>
        <p id="gallery-empty" class="empty hidden">还没有图片。传第一张上去吧。<button id="empty-go" class="link-button">去上传</button></p>
        <div class="pager">
          <button id="previous" class="ghost-button" disabled>上一页</button>
          <span id="page-label" class="pager-label">第 1 页</span>
          <button id="next" class="ghost-button">下一页</button>
        </div>
      </section>
    </main>

    <div id="settings-panel" class="settings-pop hidden">
      <h3>站点设置</h3>
      <label class="field">
        <span class="field-label">首页背景图 URL</span>
        <input id="setting-hero-url" type="url" placeholder="https://…/background.jpg" />
        <span id="setting-hero-error" class="field-error" hidden></span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field-label">每日上传上限（张）</span>
          <input id="setting-daily-limit" type="number" min="1" max="10000" />
        </label>
        <label class="field">
          <span class="field-label">单张大小上限（MB）</span>
          <input id="setting-max-size" type="number" min="1" max="100" step="0.5" />
        </label>
      </div>
      <div class="settings-actions">
        <button id="setting-save" class="primary-button">保存设置</button>
        <button id="hero-remove" class="ghost-button" hidden>移除背景图</button>
      </div>
      <div class="settings-footer">
        <button id="logout" class="ghost-button danger">退出登录</button>
      </div>
    </div>

    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
      <div class="lightbox-backdrop"></div>
      <figure class="lightbox-body">
        <img id="lightbox-image" src="" alt="" />
        <figcaption class="lightbox-caption">
          <span id="lightbox-url" class="lightbox-url"></span>
          <div class="lightbox-actions">
            <button id="lightbox-copy" class="ghost-button">复制链接</button>
            <button id="lightbox-copy-md" class="ghost-button">复制 Markdown</button>
            <a id="lightbox-open" class="ghost-button" href="" target="_blank" rel="noreferrer">原图</a>
            <button id="lightbox-delete" class="ghost-button danger">删除</button>
          </div>
        </figcaption>
      </figure>
      <button id="lightbox-close" class="lightbox-close" aria-label="关闭">&times;</button>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
